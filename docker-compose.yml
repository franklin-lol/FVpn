x-logging: &log
  driver: "json-file"
  options: { max-size: "20m", max-file: "5" }

services:
  ##############################################################################
  # BACKEND
  ##############################################################################
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniproxy-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - backend-data:/data
      - /etc/fvpn/ssl:/etc/fvpn/ssl:ro   # matches settings.CERT_PATH default (/etc/fvpn/ssl/cert.pem)
      - ./configs/xray:/etc/xray        # shared with xray container
      - ./configs/singbox:/etc/sing-box  # shared with singbox container
      # Docker socket so backend can restart proxy containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - fvpn-net
    logging: *log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ##############################################################################
  # FRONTEND
  ##############################################################################
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniproxy-frontend
    restart: unless-stopped
    networks:
      - fvpn-net
    logging: *log

  ##############################################################################
  # NGINX — SSL termination + reverse proxy
  ##############################################################################
  nginx:
    build:
      context: ./nginx
    container_name: uniproxy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "2095:2095"
      - "127.0.0.1:2096:2096"
      # NOTE: port 443 is intentionally NOT published here. nginx.conf has
      # no `listen 443` server block (panel lives on 2095/2096), but Docker
      # still reserves the host port via iptables for ANY published mapping
      # regardless of whether the app inside actually listens on it. That
      # silently fought with xray's host-network TCP/443 bind for
      # VLESS-Reality — whichever container started first won the port,
      # the other crash-looped. Port 443 is for the proxy containers only.
    volumes:
      - /etc/fvpn/ssl:/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      fvpn-net:
        ipv4_address: 172.20.0.10
    logging: *log

  ##############################################################################
  # XRAY-CORE — VLESS/Trojan/Shadowsocks proxy
  ##############################################################################
  xray:
    image: teddysun/xray:1.8.24@sha256:0bd4b642b5e4e8d1de2fe06aab18905b90a28b60bf65c3f6cbfecf6b3340733b
    container_name: fvpn-xray
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    network_mode: host          # host network so it can bind proxy ports directly
    volumes:
      - ./configs/xray:/etc/xray
      - /usr/local/share/xray:/usr/local/share/xray:ro
      - /etc/fvpn/ssl:/etc/fvpn/ssl:ro   # trojan/vmess inbounds read cert here
    logging: *log

  ##############################################################################
  # SING-BOX — Hysteria2/TUIC/ShadowTLS/WireGuard proxy
  ##############################################################################
  singbox:
    image: ghcr.io/sagernet/sing-box:v1.13.13@sha256:41c231813fc1584fcc4e8556ad839365aa47a1b730e370d89980d1878b9cdce0
    container_name: fvpn-singbox
    restart: unless-stopped
    labels:
      # xray/sing-box break their config schema on major versions often
      # enough (geoip removal in 1.12, domain_strategy deprecation right
      # after) that silent nightly auto-updates are actively dangerous here.
      # Update these two intentionally, by bumping the pinned tag above.
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      # Escape hatch sing-box itself prints in the FATAL message when an
      # outbound's domain_strategy field is used post-1.12 deprecation.
      # Safe no-op on versions where it's not needed.
      - ENABLE_DEPRECATED_LEGACY_DOMAIN_STRATEGY_OPTIONS=true
    network_mode: host          # host network for direct port binding
    # ghcr.io/sagernet/sing-box's ENTRYPOINT is the bare `sing-box` binary —
    # without an explicit subcommand it just prints help and exits, which
    # Docker then restarts forever under `restart: unless-stopped`
    # (a silent crash-loop, not an obvious config error). `run -c <path>`
    # is the actual "start the proxy" subcommand.
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./configs/singbox:/etc/sing-box
      - /etc/fvpn/ssl:/etc/fvpn/ssl:ro   # hysteria2/tuic inbounds read cert here
    cap_add:
      - NET_ADMIN               # required for TUN/WireGuard
    logging: *log

  ##############################################################################
  # TELEGRAM BOT
  ##############################################################################
  bot:
    build:
      context: ./bot
    container_name: uniproxy-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fvpn-net
    logging: *log

  ##############################################################################
  # WATCHTOWER — optional; pinned image digests require manual updates
  ##############################################################################
  watchtower:
    profiles: ["updates"]
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: uniproxy-watchtower
    restart: unless-stopped
    environment:
      # Watchtower 1.7.1 does not negotiate API versions. Docker 29 requires
      # API 1.44 or newer; older daemons can opt in with their supported API.
      DOCKER_API_VERSION: "${WATCHTOWER_DOCKER_API_VERSION:-1.44}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup
    networks:
      - fvpn-net
    logging: *log

################################################################################
volumes:
  backend-data:
  nginx-logs:

networks:
  fvpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
